---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-generator-a2a-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: code-generator-a2a-server
  template:
    metadata:
      labels:
        app: code-generator-a2a-server
    spec:
      containers:
      - name: code-generator-a2a-server

        image: 042889969014.dkr.ecr.us-east-1.amazonaws.com/code-generator-a2a-server:20251103122934

        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "100m"                # Minimum CPU guaranteed
            memory: "1024Mi"            # Minimum memory guaranteed
            ephemeral-storage: "200Mi" # Minimum disk space guaranteed
          limits:
            cpu: "500m"                # Max CPU allowed
            memory: "2000Mi"            # Max memory allowed
            # ephemeral-storage: "500Mi" # Max disk space allowed
        envFrom:
        - secretRef:
            name: aws-config-secret
        - secretRef:
            name: gemini-config-secret
        - secretRef:
            name: tiktoken-config-secret
        env:
          - name: "CODER_PORT"
            value: "5000"
          - name: "HOST"
            value: "code-generator-a2a-server-service.default.svc"
          - name: "CODER_BACKEND"
            value: "http://code-generator-backend-service.default.svc:8000"
          - name: "SERVER_NAME"
            value: "CODE_GENERATOR_A2A"
          - name: "AGENT_NAME"
            value: "CODE_GENERATOR_AGENT"
          - name: "AGENT_NAME_CONSTANT"
            value: "CODE_GENERATOR_AGENT"
          - name: "MODEL_NAME"
            value: "gemini-2.5-flash-lite"
          - name: "OTEL_RESOURCE_ATTRIBUTES"
            value: "service.version=1.0.0,service.instance.id=llm-service-yash-unified-code-generator-a2a"
      serviceAccountName: mcp-poc
---
